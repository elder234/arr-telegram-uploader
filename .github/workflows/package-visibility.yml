name: package visibility

on:
  workflow_dispatch:

# One-off helper: newly published GHCR packages default to private, so an
# anonymous `docker pull` gets 401 even though the build succeeded. This flips
# the package to public once. Safe to delete afterwards.
permissions:
  packages: write

jobs:
  make-public:
    runs-on: ubuntu-latest
    steps:
      - name: Make the container package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          endpoint="https://api.github.com/users/${OWNER}/packages/container/arr-telegram-uploader"
          for attempt in 1 2 3; do
            # curl rather than gh api: it prints the response body on failure,
            # so a 403 says *why* rather than just "not 204".
            code=$(curl -sS -o /tmp/body -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d '{"visibility":"public"}' "$endpoint")
            echo "attempt ${attempt} -> HTTP ${code}"
            if [ "$code" = "204" ]; then
              echo "package is public"
              exit 0
            fi
            head -c 500 /tmp/body; echo
            sleep 10
          done
          echo "::notice::Could not change visibility automatically. Set it in the"
          echo "::notice::package settings UI: Settings > General > Danger Zone."
          exit 1