name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # github.actor is empty on a tag push driven by a PAT, and an empty
        # owner would silently publish under the wrong namespace.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        # Confirm the entry point, config loading, and SQLite init all work before
        # publishing, so a broken image is caught here rather than on your server.
        # Dummy credentials are enough: `check` validates wiring, it does not
        # contact Telegram.
        run: |
          image=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)
          echo "testing $image"
          docker run --rm \
            -e TELEGRAM_API_ID=1 \
            -e TELEGRAM_API_HASH=smoketest \
            -e TELEGRAM_CHAT_ID=1 \
            "$image" check || {
            echo "::error::image failed the check subcommand"
            docker run --rm "$image" --help
            exit 1
          }