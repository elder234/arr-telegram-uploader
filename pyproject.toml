[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arr-telegram-uploader"
version = "0.1.0"
description = "Reliable Radarr -> TorBox -> Telegram uploader with verified-upload deletion"
requires-python = ">=3.11"
dependencies = [
    "kurigram>=2.2.7",
    "tgcrypto>=1.2.5",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
arr-uploader = "arr_uploader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
# Explicit: without this, a stray directory under src/ can be picked up as a
# package and fail the build, and __pycache__ is not something to ship.
include = ["arr_uploader*"]

[tool.setuptools.package-data]
# schema.sql is read at runtime to create tables, so it must travel with the
# wheel. Missing it means the package installs cleanly and then fails on first
# use, which is the worst time to discover it.
arr_uploader = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]